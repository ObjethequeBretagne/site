name: Refresh HelloAsso Tokens

on:
  schedule:
    - cron: '0 0 */25 * *' # Tous les 25 jours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Permission pour écrire les secrets
      actions: write

    steps:
      # 1. Rafraîchir les tokens via HelloAsso
      - name: Refresh HelloAsso Tokens
        id: refresh-tokens
        run: |
          curl -X POST https://api.helloasso.com/oauth2/token \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=refresh_token" \
          -d "refresh_token=${{ secrets.HELLOASSO_REFRESH_TOKEN }}" \
          -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}" > token_response.json

          ACCESS_TOKEN=$(jq -r '.access_token' token_response.json)
          REFRESH_TOKEN=$(jq -r '.refresh_token' token_response.json)

          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Erreur : Impossible d'obtenir de nouveaux tokens."
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "REFRESH_TOKEN=$REFRESH_TOKEN" >> $GITHUB_ENV

      # 2. Mettre à jour les secrets via une action GitHub officielle
      - name: Update Repository Secrets
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret: HELLOASSO_ACCESS_TOKEN
          value: ${{ env.ACCESS_TOKEN }}
      - name: Update Repository Secrets (Refresh Token)
        uses: peter-evans/create-or-update-secret@v2
        with:
          secret: HELLOASSO_REFRESH_TOKEN
          value: ${{ env.REFRESH_TOKEN }}
