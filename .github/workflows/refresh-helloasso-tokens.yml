name: Refresh HelloAsso Tokens
on:
  schedule:
    - cron: '0 0 */25 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Refresh Tokens
        id: refresh
        run: |
          response=$(curl -X POST https://api.helloasso.com/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.HELLOASSO_REFRESH_TOKEN }}")
          
          echo "HELLOASSO_ACCESS_TOKEN=$(echo $response | jq -r .access_token)" >> $GITHUB_ENV
          echo "HELLOASSO_REFRESH_TOKEN=$(echo $response | jq -r .refresh_token)" >> $GITHUB_ENV
