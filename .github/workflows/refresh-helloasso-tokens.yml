name: Refresh HelloAsso Tokens

on:
  schedule:
    - cron: '0 0 */25 * *' # Tous les 25 jours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      secrets: write  # Donne la permission pour écrire les secrets
      actions: write

    steps:
      # 1. Rafraîchir les tokens via HelloAsso
      - name: Refresh HelloAsso Tokens
        id: refresh-tokens
        run: |
          curl -X POST https://api.helloasso.com/oauth2/token \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=refresh_token" \
          -d "refresh_token=${{ secrets.HELLOASSO_REFRESH_TOKEN }}" \
          -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}" > token_response.json

          ACCESS_TOKEN=$(cat token_response.json | jq -r .access_token)
          REFRESH_TOKEN=$(cat token_response.json | jq -r .refresh_token)

          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Erreur : Impossible d'obtenir de nouveaux tokens."
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "REFRESH_TOKEN=$REFRESH_TOKEN" >> $GITHUB_ENV

      # 2. Mettre à jour les secrets via GitHub API
      - name: Update Repository Secrets
        uses: actions/github-script@v6
        with:
          script: |
            const { createOrUpdateRepoSecret } = require("@actions/github").context;
            const crypto = require("crypto");
            const sodium = require("libsodium-wrappers");

            // Charger les secrets
            const accessToken = process.env.ACCESS_TOKEN;
            const refreshToken = process.env.REFRESH_TOKEN;

            if (!accessToken || !refreshToken) {
              throw new Error("Les tokens ACCESS_TOKEN ou REFRESH_TOKEN sont manquants.");
            }

            // Fonction pour chiffrer une valeur avec la clé publique
            async function encrypt(secret, publicKey) {
              await sodium.ready;
              const keyBytes = sodium.from_base64(publicKey, sodium.base64_variants.ORIGINAL);
              const messageBytes = sodium.from_string(secret);
              const encryptedBytes = sodium.crypto_box_seal(messageBytes, keyBytes);
              return sodium.to_base64(encryptedBytes, sodium.base64_variants.ORIGINAL);
            }

            // Obtenir la clé publique du dépôt
            const { data: publicKey } = await github.rest.actions.getRepoPublicKey({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            // Chiffrer et sauvegarder les secrets
            const encryptedAccessToken = await encrypt(accessToken, publicKey.key);
            const encryptedRefreshToken = await encrypt(refreshToken, publicKey.key);

            await github.rest.actions.createOrUpdateRepoSecret({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: "HELLOASSO_ACCESS_TOKEN",
              encrypted_value: encryptedAccessToken,
              key_id: publicKey.key_id,
            });

            await github.rest.actions.createOrUpdateRepoSecret({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: "HELLOASSO_REFRESH_TOKEN",
              encrypted_value: encryptedRefreshToken,
              key_id: publicKey.key_id,
            });

            console.log("Les secrets ont été mis à jour avec succès.");
