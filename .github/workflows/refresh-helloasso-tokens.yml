name: Refresh HelloAsso Tokens
on:
  schedule:
    - cron: '0 0 */25 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Get New Tokens
        id: get-tokens
        run: |
          curl -X POST https://api.helloasso.com/oauth2/token \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=client_credentials" \
          -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}" > token_response.json

          ACCESS_TOKEN=$(cat token_response.json | jq -r .access_token)
          REFRESH_TOKEN=$(cat token_response.json | jq -r .refresh_token)
          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"
          echo "access_token=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "refresh_token=$REFRESH_TOKEN" >> $GITHUB_ENV

      - name: Update Repository Secrets
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const tokenData = JSON.parse(fs.readFileSync('token_response.json', 'utf8'));
            
            await core.setSecret(tokenData.access_token);
            await core.setSecret(tokenData.refresh_token);
            
            const repoToken = process.env.access_token;
            const refreshToken = process.env.refresh_token;
            
            await github.rest.actions.updateRepoSecret({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'HELLOASSO_ACCESS_TOKEN',
              encrypted_value: repoToken
            });
            
            await github.rest.actions.updateRepoSecret({
              owner: context.repo.owner,
              repo: context.repo.repo,
              secret_name: 'HELLOASSO_REFRESH_TOKEN',
              encrypted_value: refreshToken
            });
