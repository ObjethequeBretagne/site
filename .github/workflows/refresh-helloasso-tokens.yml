name: Refresh HelloAsso Tokens
on:
  schedule:
    - cron: '0 0 */25 * *' # Tous les 25 jours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Get New Tokens
        id: get-tokens
        run: |
          response=$(curl -X POST https://api.helloasso.com/oauth2/token \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=client_credentials" \
          -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}")
          
          # Sauvegarde des nouveaux tokens dans des fichiers temporaires
          echo $response | jq -r .access_token > access_token.txt
          echo $response | jq -r .refresh_token > refresh_token.txt

      - name: Configure Git
        run: |
          git config user.name "ObjethequeBretagne"
          git config user.email "cornouailleobjethequedev@gmail.com"
          
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update Secrets in Repository Settings
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lecture des tokens depuis les fichiers
          ACCESS_TOKEN=$(cat access_token.txt)
          REFRESH_TOKEN=$(cat refresh_token.txt)
          
          # Mise à jour des secrets via l'API GitHub
          gh secret set HELLOASSO_ACCESS_TOKEN --body "$ACCESS_TOKEN"
          gh secret set HELLOASSO_REFRESH_TOKEN --body "$REFRESH_TOKEN"

          # Nettoyage des fichiers temporaires
          rm access_token.txt refresh_token.txt
