name: Refresh HelloAsso Tokens

on:
  schedule:
    - cron: '0 0 */25 * *' # Tous les 25 jours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      actions: write  # Permet de mettre à jour les secrets
      contents: write  # Permission nécessaire pour manipuler les secrets du dépôt

    steps:
      # 1. Rafraîchir les tokens via l'API HelloAsso
      - name: Refresh HelloAsso Tokens
        id: refresh-tokens
        run: |
          echo "Rafraîchissement des tokens..."
          RESPONSE=$(curl -s -X POST https://api.helloasso.com/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=refresh_token" \
            -d "refresh_token=${{ secrets.HELLOASSO_REFRESH_TOKEN }}" \
            -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}")

          ACCESS_TOKEN=$(echo "$RESPONSE" | jq -r '.access_token')
          REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refresh_token')

          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" == "null" ]; then
            echo "Erreur : Impossible de récupérer un nouveau token d'accès."
            echo "Réponse API : $RESPONSE"
            exit 1
          fi

          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> $GITHUB_ENV
          echo "REFRESH_TOKEN=$REFRESH_TOKEN" >> $GITHUB_ENV

      # 2. Mettre à jour les secrets dans GitHub
      - name: Update HELLOASSO_ACCESS_TOKEN Secret
        run: |
          echo "Mise à jour du secret HELLOASSO_ACCESS_TOKEN..."
          gh secret set HELLOASSO_ACCESS_TOKEN --body "$ACCESS_TOKEN"

      - name: Update HELLOASSO_REFRESH_TOKEN Secret
        run: |
          echo "Mise à jour du secret HELLOASSO_REFRESH_TOKEN..."
          gh secret set HELLOASSO_REFRESH_TOKEN --body "$REFRESH_TOKEN"
