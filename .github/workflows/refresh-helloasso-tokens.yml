name: Refresh HelloAsso Tokens

on:
  schedule:
    - cron: '0 0 */25 * *' # Tous les 25 jours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      # 1. Installer GitHub CLI
      - name: Install GitHub CLI
        run: |
          sudo apt update
          sudo apt install -y gh

      # 2. Rafraîchir les tokens via HelloAsso
      - name: Refresh HelloAsso Tokens
        id: refresh-tokens
        run: |
          curl -X POST https://api.helloasso.com/oauth2/token \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=refresh_token" \
          -d "refresh_token=${{ secrets.HELLOASSO_REFRESH_TOKEN }}" \
          -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}" > token_response.json

          ACCESS_TOKEN=$(cat token_response.json | jq -r .access_token)
          REFRESH_TOKEN=$(cat token_response.json | jq -r .refresh_token)

          if [ -z "$ACCESS_TOKEN" ] || [ -z "$REFRESH_TOKEN" ]; then
            echo "Erreur : Impossible d'obtenir de nouveaux tokens."
            exit 1
          fi

          echo "::set-output name=access_token::$ACCESS_TOKEN"
          echo "::set-output name=refresh_token::$REFRESH_TOKEN"

      # 3. Mettre à jour les secrets GitHub
      - name: Update Repository Secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ steps.refresh-tokens.outputs.access_token }}
          REFRESH_TOKEN: ${{ steps.refresh-tokens.outputs.refresh_token }}
        run: |
          echo "Mise à jour des secrets dans GitHub..."
          gh secret set HELLOASSO_ACCESS_TOKEN --body "$ACCESS_TOKEN"
          gh secret set HELLOASSO_REFRESH_TOKEN --body "$REFRESH_TOKEN"
