name: Refresh HelloAsso Tokens
on:
  schedule:
    - cron: '0 0 */25 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Get New Tokens
        id: tokens
        run: |
          response=$(curl -X POST https://api.helloasso.com/oauth2/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "grant_type=client_credentials" \
            -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}")
          
          echo "::add-mask::$(echo $response | jq -r .access_token)"
          echo "::add-mask::$(echo $response | jq -r .refresh_token)"
          
          echo "access_token=$(echo $response | jq -r .access_token)" >> $GITHUB_OUTPUT
          echo "refresh_token=$(echo $response | jq -r .refresh_token)" >> $GITHUB_OUTPUT

      - name: Update Secrets
        uses: gliech/create-github-secret-action@v1
        with:
          name: HELLOASSO_ACCESS_TOKEN
          value: ${{ steps.tokens.outputs.access_token }}
          pa_token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Update Refresh Token
        uses: gliech/create-github-secret-action@v1
        with:
          name: HELLOASSO_REFRESH_TOKEN
          value: ${{ steps.tokens.outputs.refresh_token }}
          pa_token: ${{ secrets.GITHUB_TOKEN }}
