name: Refresh HelloAsso Tokens
on:
  schedule:
    - cron: '0 0 */25 * *' # Tous les 25 jours
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # 1. Cloner le dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Rafraîchir les tokens via l'API HelloAsso
      - name: Get New Tokens
        id: get-tokens
        run: |
          response=$(curl -X POST https://api.helloasso.com/oauth2/token \
          -H "Content-Type: application/x-www-form-urlencoded" \
          -d "grant_type=client_credentials" \
          -d "client_id=${{ secrets.HELLOASSO_CLIENT_ID }}" \
          -d "client_secret=${{ secrets.HELLOASSO_CLIENT_SECRET }}")
          
          echo "access_token=$(echo $response | jq -r .access_token)" >> $GITHUB_OUTPUT
          echo "refresh_token=$(echo $response | jq -r .refresh_token)" >> $GITHUB_OUTPUT

      # 3. Mettre à jour les secrets
      - name: Update Access Token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          
      - name: Update Secrets Using GitHub CLI
        env:
          GH_TOKEN: ${{ steps.create-github-app-token.outputs.token }}
        run: |
          gh secret set HELLOASSO_ACCESS_TOKEN --body "${{ steps.get-tokens.outputs.access_token }}"
          gh secret set HELLOASSO_REFRESH_TOKEN --body "${{ steps.get-tokens.outputs.refresh_token }}"
