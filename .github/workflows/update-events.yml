name: Update Events JSON

on:
  schedule:
    - cron: '0 0 * * *' # Tous les jours à 3h
  workflow_dispatch: # Déclenchement manuel

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout du dépôt
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. Configuration de Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20' # Version LTS de Node.js

      # 3. Installation des dépendances
      - name: Install dependencies
        run: npm install

      # 4. Récupération des événements via le script Node.js
      - name: Fetch events from HelloAsso
        run: node fetch-events.js
        env:
          HELLOASSO_ACCESS_TOKEN: ${{ secrets.HELLOASSO_ACCESS_TOKEN }}
          HELLOASSO_REFRESH_TOKEN: ${{ secrets.HELLOASSO_REFRESH_TOKEN }}
          HELLOASSO_CLIENT_ID: ${{ secrets.HELLOASSO_CLIENT_ID }}
          HELLOASSO_CLIENT_SECRET: ${{ secrets.HELLOASSO_CLIENT_SECRET }}

      # 5. Configuration de la clé SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      # 8. Commit et push des changements si nécessaire
      - name: Commit and push changes
        run: |
          git config user.name "ObjethequeBretagne"
          git config user.email "cornouailleobjethequedev@gmail.com"
          git remote set-url origin git@github.com:ObjethequeBretagne/site.git
          git add public/events.json
          if git diff --cached --quiet; then
            echo "Aucun changement détecté, aucune action requise."
          else
            git commit -m "Mise à jour des événements depuis HelloAsso"
            git push git@github.com:ObjethequeBretagne/site.git astro-version
          fi
