name: Update Events JSON

on:
  schedule:
    - cron: '0 0 * * 1' # Tous les lundis à minuit
  workflow_dispatch: # Déclenchement manuel

jobs:
  update-events:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22' # Version de Node.js à utiliser

      - name: Install dependencies
        run: npm install

      - name: Fetch events from HelloAsso
        run: node fetch-events.js
        env:
          HELLOASSO_API_KEY: ${{ secrets.HELLOASSO_API_KEY }}
    
      - name: Commit and push changes
        run: |
          git config user.name "ObjethequeBretagne"
          git config user.email "cornouailleobjethequedev@gmail.com"
          git add src/scripts/events.json
          git commit -m "Mise à jour des événements depuis HelloAsso"
          git push origin astro-version
